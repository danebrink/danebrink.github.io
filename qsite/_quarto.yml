project:
  type: website
  output-dir: _site

website:
  title: "Dane Brink"
  description: "PhD student in Economics at the University of Michigan."
  site-url: "https://danebrink.github.io"
  open-graph: true
  twitter-card: true
  favicon: images/University-of-Michigan.jpg

  search: false
  navbar:
    pinned: true
    collapse-below: md
    left:
      - text: Home
        href: index.qmd
      - text: Research
        href: research.qmd
      - text: Teaching
        href: teaching.qmd
    right:
      - text: CV
        href: files/Dane_Brink_CV.pdf
        aria-label: Curriculum Vitae (PDF)
      - icon: envelope
        href: mailto:danebrnk@umich.edu
        aria-label: Email
      - icon: github
        href: https://github.com/danebrink
        aria-label: GitHub

  page-footer:
    left: "© 2026 Dane Brink"
    center: "Department of Economics · University of Michigan"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [theme-light.scss]
      dark: [theme-dark.scss]
    css: styles.css
    toc: false
    page-layout: full
    smooth-scroll: true
    link-external-newwindow: true
    anchor-sections: false
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
    monofont: "JetBrains Mono, ui-monospace, SFMono-Regular, monospace"
